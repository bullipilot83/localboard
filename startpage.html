function card(l,map){const el=document.createElement('article');el.className='card';el.dataset.id=l.id;const host=new URL(l.url).host;el.innerHTML=`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span class="icon">${esc(l.name.slice(0,1).toUpperCase())}</span><span class="card-text"><strong>${esc(l.name)}</strong><small>${esc(host)}</small></span></a>`;el.title=l.name+'\n'+l.url;const src=l.icon||(l.favicon?new URL('/favicon.ico',l.url).href:'');if(src){const icon=el.querySelector('.icon'),img=new Image();img.alt='';img.referrerPolicy='no-referrer';img.onload=()=>icon.replaceChildren(img);img.src=src;}
 if(editing){const b=document.createElement('button');b.className='edit-link';b.textContent='✎';b.title='Link bearbeiten';b.setAttribute('aria-label',l.name+' bearbeiten');b.onclick=()=>editLink(l);el.append(b);el.querySelector('a').onclick=e=>{e.preventDefault();if(!map)editLink(l);};if(map){el.tabIndex=0;el.setAttribute('aria-label',l.name+'; mit Pfeiltasten verschieben');el.onkeydown=e=>{const v={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(v&&e.target===el){e.preventDefault();l.x=Math.max(0,Math.min(100,l.x+v[0]));l.y=Math.max(0,Math.min(100,l.y+v[1]));position(el,l);persist();}};el.onpointerdown=e=>{if(e.target.closest('button')||e.button!==0)return;e.preventDefault();const mapRect=el.parentElement.getBoundingClientRect(),startX=e.clientX,startY=e.clientY,x=l.x,y=l.y;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{l.x=Math.max(0,Math.min(100,x+(ev.clientX-startX)/mapRect.width*100));l.y=Math.max(0,Math.min(100,y+(ev.clientY-startY)/mapRect.height*100));position(el,l);};el.onpointerup=()=>{el.onpointermove=null;persist();};el.onpointercancel=()=>{el.onpointermove=null;persist();};};}else{el.draggable=true;el.ondragstart=e=>{e.dataTransfer.setData('application/x-localboard',l.id);e.dataTransfer.effectAllowed='move';};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{const id=e.dataTransfer.getData('application/x-localboard');if(!id)return;e.preventDefault();e.stopPropagation();const from=data.links.findIndex(x=>x.id===id);if(from<0||data.links[from].group!==l.group)return;const item=data.links.splice(from,1)[0];data.links.splice(data.links.indexOf(l),0,item);persist();renderContent();};}}
 if(map)position(el,l);return el;}
function position(el,l){el.style.left=`clamp(86px, ${l.x}%, calc(100% - 86px))`;el.style.top=`clamp(32px, ${l.y}%, calc(100% - 32px))`;}
let submitAction=null;function dialog(title,html,submit,remove){$('#dialogTitle').textContent=title;$('#fields').innerHTML=html;$('#save').hidden=!submit;$('#remove').hidden=!remove;$('#remove').onclick=remove||null;submitAction=submit;$('#modal').showModal();}
$('#form').onsubmit=async e=>{e.preventDefault();if(!submitAction)return;$('#save').disabled=true;try{await submitAction();$('#modal').close();persist();render();}catch(err){alert(err.message);}finally{$('#save').disabled=false;}};$('#close').onclick=$('#cancel').onclick=()=>$('#modal').close();
async function imageData(file,maxWidth){if(!file)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>20*1024*1024)throw Error('Bitte PNG, JPG oder WebP bis 20 MB auswählen.');const raw=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file);});const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error('Bild nicht lesbar.'));i.src=raw;});const ratio=img.width/img.height;if(ratio<.1||ratio>10)throw Error('Bildformat zu schmal oder zu breit.');const factor=Math.min(1,maxWidth/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*factor);c.height=Math.round(img.height*factor);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return {src:c.toDataURL('image/webp',.85),ratio};}
function editLink(link,initial='',group){if(link&&!editing)return;if(!data.groups.length){message('Bitte zuerst im Bearbeitungsmodus eine Gruppe anlegen.');return;}dialog(link?'Link bearbeiten':'Neuer Link',`<label>Name<input id="lname" maxlength="160" required value="${esc(link?.name||'')}"></label><label>Adresse<input id="lurl" required placeholder="http://192.168.1.10" value="${esc(link?.url||initial)}"></label><label>Gruppe<select id="lgroup">${groupOptions(link?.group||group||(data.active!=='all'?data.active:data.groups[0].id))}</select></label><label class="check"><input type="checkbox" id="lfav" ${link?.favicon?'checked':''}>Favicon direkt vom Zielserver laden</label><p class="note">Lädt /favicon.ico ohne externen Icon-Dienst. Wenn nicht verfügbar, erscheint der Anfangsbuchstabe.</p><label>Eigenes Icon (PNG, JPG, WebP)<input type="file" id="licon" accept="image/png,image/jpeg,image/webp"></label>${link?.icon?'<label class="check"><input type="checkbox" id="clearIcon">Eigenes Icon entfernen</label>':''}<label>Kartenposition X / Y in Prozent<div style="display:flex;gap:8px"><input aria-label="X Position" id="lx" type="number" min="0" max="100" step="any" value="${link?.x??50}"><input aria-label="Y Position" id="ly" type="number" min="0" max="100" step="any" value="${link?.y??50}"></div></label>`,async()=>{const name=$('#lname').value.trim();if(!name)throw Error('Bitte einen Namen eingeben.');const u=url($('#lurl').value),uploaded=await imageData($('#licon').files[0],96);const obj={id:link?.id||uid(),name,url:u,group:$('#lgroup').value,favicon:$('#lfav').checked,icon:uploaded?.src||($('#clearIcon')?.checked?'':link?.icon||''),x:Number($('#lx').value),y:Number($('#ly').value)};if(link)Object.assign(link,obj);else data.links.push(obj);},link?()=>{if(editing&&confirm('Link „'+link.name+'“ wirklich löschen?')){data.links=data.links.filter(l=>l!==link);$('#modal').close();persist();render();}}:null);}
function editGroup(g){if(!editing)return;const blocked=g?descendants(g.id):[];dialog(g?'Gruppe bearbeiten':'Gruppe / Tab anlegen',`<label>Name<input id="gname" maxlength="160" required value="${esc(g?.name||'')}"></label><label>Übergeordnete Gruppe<select id="gparent"><option value="">Keine · eigener Haupt-Tab</option>${groupOptions(g?.parent|| (data.active==='all'?null:data.active),blocked)}</select></label><p class="note">Jede Gruppe ist einzeln aufrufbar. Untergruppen erscheinen als Tabs innerhalb ihrer übergeordneten Gruppe.</p>`,()=>{const name=$('#gname').value.trim();if(!name)throw Error('Bitte einen Namen eingeben.');const p=$('#gparent').value||null;if(g)Object.assign(g,{name,parent:p});else{const id=uid();data.groups.push({id,name,parent:p,background:'',ratio:16/9});data.active=id;}},g?()=>{const ids=descendants(g.id),count=data.links.filter(l=>ids.includes(l.group)).length;if(confirm(`„${g.name}“ mit ${ids.length-1} Untergruppen und ${count} Links löschen?`)){data.groups=data.groups.filter(x=>!ids.includes(x.id));data.links=data.links.filter(x=>!ids.includes(x.group));data.active='all';$('#modal').close();persist();render();}}:null);}
$('#lock').onclick=()=>{if(!editing&&!confirm('Bearbeitungsmodus aktivieren? Links und Gruppen können dann geändert oder gelöscht werden.'))return;editing=!editing;render();};$('#add').onclick=()=>editLink();$('#newGroup').onclick=()=>editGroup();$('#groupEdit').onclick=()=>editGroup(data.groups.find(g=>g.id===data.active));$('#search').oninput=renderContent;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{data.views[data.active]=b.dataset.view;persist();renderContent();});
$('#background').onclick=()=>{if(!editing)return;const g=data.groups.find(g=>g.id===data.active);dialog('Kartenbild',`<p class="note">Ein eigener Plan pro Gruppe. Das Seitenverhältnis bleibt erhalten; Icons werden prozentual positioniert.</p><label>Grundriss oder Karte<input id="bgfile" type="file" accept="image/png,image/jpeg,image/webp"></label>${g.background?'<label class="check"><input id="bgclear" type="checkbox">Vorhandenes Bild entfernen</label>':''}`,async()=>{const img=await imageData($('#bgfile').files[0],2000);if(img){g.background=img.src;g.ratio=img.ratio;}else if($('#bgclear')?.checked)g.background='';data.views[g.id]='map';});};
function download(name,content,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
async function portable(){const css=document.querySelector('link[rel=stylesheet]');let styleText='',jsText='';if(css){try{styleText=[...css.sheet.cssRules].map(r=>r.cssText).join('\n');}catch{throw Error('Stylesheet nicht zugänglich. Nutze die mitgelieferte Einzeldatei Localboard-Standalone.html für den HTML-Export.');}try{jsText=await fetch('app.js').then(r=>{if(!r.ok)throw Error();return r.text();});}catch{throw Error('Dieser Browser blockiert das Einlesen lokaler Skripte. Nutze Localboard-Standalone.html für den HTML-Export.');}}else{styleText=$('#appStyle').textContent;jsText=$('#appCode').textContent;}
 const doc=document.documentElement.cloneNode(true);doc.querySelector('link[rel=stylesheet]')?.remove();doc.querySelector('#appStyle')?.remove();const st=document.createElement('style');st.id='appStyle';st.textContent=styleText;doc.querySelector('head').append(st);doc.querySelector('script[src]')?.remove();doc.querySelector('#appCode')?.remove();const script=document.createElement('script');script.id='appCode';script.textContent=jsText;doc.querySelector('body').append(script);const snapshot=JSON.parse(JSON.stringify(data));snapshot.baseRevision=snapshot.revision;doc.querySelector('#seed').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c');doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#fields').replaceChildren();doc.querySelector('#tree').replaceChildren();doc.querySelector('#content').replaceChildren();doc.querySelector('#tabs').replaceChildren();doc.querySelector('#notice').hidden=true;doc.querySelector('body').classList.remove('editing');download('Localboard-Standalone.html','<!doctype html>\n'+doc.outerHTML,'text/html');message('HTML-Snapshot exportiert – enthält alle Links, eigenen Icons und Kartenbilder.');}
$('#export').onclick=()=>{dialog('Dashboard exportieren','<div class="help"><p>JSON sichert alle Links, Gruppen, Ansichten, Positionen, Icons und Kartenbilder.</p><button type="button" id="jsonExport" class="wide">↓ JSON-Sicherung</button><p>HTML bündelt zusätzlich die Anwendung. Auf ein anderes Gerät kopieren und direkt öffnen.</p><button type="button" id="htmlExport" class="wide">↓ Portable HTML-Datei</button></div>',null);$('#jsonExport').onclick=()=>{download('Localboard-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');};$('#htmlExport').onclick=async()=>{try{await portable();$('#modal').close();}catch(e){alert(e.message);}};};
$('#import').onclick=()=>{if(editing)$('#importFile').click();};$('#importFile').onchange=async e=>{try{if(!editing||!e.target.files[0])return;const f=e.target.files[0];if(f.size>30*1024*1024)throw Error('Datei ist größer als 30 MB.');const incoming=validate(JSON.parse(await f.text()));if(!confirm(`Aktuelles Dashboard durch ${incoming.links.length} Links und ${incoming.groups.length} Gruppen ersetzen? Vorher bei Bedarf exportieren.`))return;data=incoming;persist();render();message('Dashboard importiert.');}catch(err){alert('Import fehlgeschlagen: '+err.message);}finally{e.target.value='';}};
const main=$('main');main.ondragover=e=>{if(e.dataTransfer.types.includes('application/x-localboard'))return;e.preventDefault();main.classList.add('drop-target');};main.ondragleave=e=>{if(!main.contains(e.relatedTarget))main.classList.remove('drop-target');};main.ondrop=e=>{e.preventDefault();main.classList.remove('drop-target');if(e.dataTransfer.types.includes('application/x-localboard'))return;const raw=(e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain')).split(/\r?\n/).find(x=>x&&!x.startsWith('#'));if(!raw){message('Keine Webadresse erkannt. Bitte den ＋ Button verwenden.');return;}try{editLink(null,url(raw),e.target.closest('[data-group]')?.dataset.group);}catch(err){message(err.message);}};
$('#help').onclick=()=>dialog('Gut zu wissen','<div class="help"><h3>Starten & speichern</h3><p>Ohne Installation. Änderungen liegen in diesem Browserprofil. Nach Verschieben der HTML-Datei, Browserwechsel oder Löschen von Browserdaten kann dieser Speicher fehlen. Regelmäßig exportieren.</p><h3>Schutz vor Fehlbedienung</h3><p>Hinzufügen ist immer möglich. Ändern, Löschen, Kartenbearbeitung und Import erfordern den Bearbeitungsmodus. Dieser ist keine Anmeldung und kein Zugriffsschutz.</p><h3>Netzlaufwerk</h3><p>HTML-Snapshot auf dem Netzlaufwerk bereitstellen. Andere Geräte öffnen diese Datei. Änderungen im Browser schreiben die Datei nicht zurück. Zum Verteilen erneut exportieren und die gemeinsame Datei ersetzen. Keine automatische Synchronisation oder gleichzeitige Bearbeitung.</p><h3>Icons & Kameras</h3><p>Eigene Icons und Kartenbilder sind im Export enthalten. Favicons werden optional direkt beim Ziel abgerufen; das kann der Browser oder Zielserver blockieren. Kamera-Links öffnen die Weboberfläche, keine eingebetteten Live-Streams.</p><h3>Bedienung</h3><p>Jede Gruppe ist ein Tab. Im Bearbeitungsmodus ordnen die Pfeile ↑ und ↓ neben den Gruppen die jeweilige Ebene. Untergruppen bleiben zugeordnet. In der Kartenansicht zum Bearbeiten ziehen oder Karte per Tab-Taste fokussieren und Pfeiltasten nutzen. X/Y-Werte sind auch im Link-Dialog editierbar.</p></div>',null);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==lastStored){message('Dashboard in anderem Browser-Tab geändert. Vor weiterer Bearbeitung neu laden. Eigene ungesicherte Änderungen vorher exportieren.');}});
render();if(startupWarning)message(startupWarning);else if(!seed&&!data.links.length)message('Willkommen. Die Beispielgruppen kannst du im Bearbeitungsmodus umbenennen. Füge deinen ersten Link mit ＋ hinzu.');
