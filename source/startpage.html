<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Localboard · Deine Startseite</title><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="#">▦ <span>localboard<small data-i18n="brandTag">DEIN LOKALER STARTPUNKT</small></span></a><div class="side-label" data-i18n="workspaces">ARBEITSBEREICHE</div><nav id="tree"></nav><button id="newGroup" data-i18n="newGroupButton" class="edit-only wide">＋ Gruppe / Tab</button><div class="side-bottom"><span class="dot"></span> <span data-i18n="cloudFree">Ohne Cloud. Bei dir.</span><p data-i18n="sideNote">Links, Standorte und Systeme. Alles an einem Ort.</p></div></aside>
